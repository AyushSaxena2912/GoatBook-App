name: Build Android APK (Free)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yaml'
      - '.github/scripts/configure-android-signing.py'

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Expo Prebuild
        run: |
          cd frontend
          npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing. Add it in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/android/app/release.keystore
          test -s frontend/android/app/release.keystore

      - name: Configure release signing
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing signing secrets (ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_KEY_ALIAS)."
            exit 1
          fi

          {
            echo "GOATBOOK_UPLOAD_STORE_FILE=release.keystore"
            echo "GOATBOOK_UPLOAD_KEY_ALIAS=${KEY_ALIAS}"
            echo "GOATBOOK_UPLOAD_STORE_PASSWORD=${STORE_PASSWORD}"
            echo "GOATBOOK_UPLOAD_KEY_PASSWORD=${KEY_PASSWORD}"
          } >> frontend/android/gradle.properties

          python3 .github/scripts/configure-android-signing.py

      - name: Build Android Release APK
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist/GoatBook.apk
          ls -lh dist/GoatBook.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoatBook-APK
          path: dist/GoatBook.apk

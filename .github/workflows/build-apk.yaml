name: Build Android APK (Free)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yaml'
      - '.github/scripts/configure-android-signing.py'

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Expo Prebuild
        run: |
          cd frontend
          npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          # Trim whitespace/newlines accidentally pasted into GitHub secrets
          STORE_PASS=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n\t' | xargs)
          KEY_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n\t' | xargs)

          echo "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 -d > frontend/android/app/release.keystore
          test -s frontend/android/app/release.keystore

          if [ -z "$STORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS is empty after trim."
            exit 1
          fi

          echo "Keystore bytes: $(wc -c < frontend/android/app/release.keystore)"
          echo "Password length: ${#STORE_PASS}"
          echo "Alias length: ${#KEY_ALIAS}"

          if ! keytool -list \
            -keystore frontend/android/app/release.keystore \
            -storepass "$STORE_PASS" \
            -alias "$KEY_ALIAS" > /dev/null; then
            echo "::error::Keystore password/alias mismatch. Update secrets to exact values: password GoatBook@Sign2026, alias goatbook (no spaces/newlines)."
            exit 1
          fi

      - name: Configure release signing
        run: python3 .github/scripts/configure-android-signing.py

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Trim again for Gradle env
          export ANDROID_KEYSTORE_PASSWORD=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n\t' | xargs)
          export ANDROID_KEY_PASSWORD=$(printf '%s' "$ANDROID_KEY_PASSWORD" | tr -d '\r\n\t' | xargs)
          export ANDROID_KEY_ALIAS=$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '\r\n\t' | xargs)
          cd frontend/android
          ./gradlew assembleRelease

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist/GoatBook.apk
          ls -lh dist/GoatBook.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoatBook-APK
          path: dist/GoatBook.apk

name: Build Android APK (Free)

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/build-apk.yaml'
      - '.github/scripts/configure-android-signing.py'

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Expo Prebuild
        run: |
          cd frontend
          npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > frontend/android/app/release.keystore
          test -s frontend/android/app/release.keystore
          # Sanity-check password/alias against the decoded keystore (fails fast if secrets mismatch)
          keytool -list \
            -keystore frontend/android/app/release.keystore \
            -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.ANDROID_KEY_ALIAS }}" > /dev/null

      - name: Configure release signing
        run: python3 .github/scripts/configure-android-signing.py

      - name: Build Android Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cd frontend/android
          ./gradlew assembleRelease

      - name: Prepare downloadable APK
        run: |
          mkdir -p dist
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist/GoatBook.apk
          ls -lh dist/GoatBook.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoatBook-APK
          path: dist/GoatBook.apk
